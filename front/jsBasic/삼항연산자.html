<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼항연산자</title>

</head>
<body>
  <h1>삼항연산자</h1>
  <p> 조건 ? 참인 경우 : 거짓인 경우</p>
  <script>
    if(1<2) {
      console.log('참입니다.');
    }else{
      console.log('거짓입니다.');
    }
    // (1 < 2 ) ? console.log("참입니다.") : console.log("거짓입니다")
    const txt = (1<2)?"참입니다.":"거짓입니다.";
    console.log(txt);
  </script>
</body>
</html>
