<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array</title>
</head>
<body>
  <h1> array 추가</h1>
  <script>
    const arr = [1, 2, 3, 4, 5];
    arr.push(30);
    arr.push(40);
    arr.push(50); // 원본 밴여리 수정됨, 값 유지 X
    console.log(arr); // 리액트에서 데이터 추가 시 사용하지 않음
    // 원본을 훼손하지 않고 복사본을 만듦
    const num =[10,20,30];
    const num3 = num.concat();
    const num1 = num.concat(40,50,60);
    const num2 = num1.concat('강아지','고양이');
    console.log(num); // 원본
    console.log(num1); // nums를 그대로 복사
    console.log(num2);
    console.log(num3);
  </script>
</body>
</html>
